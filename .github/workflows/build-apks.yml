name: Build and release APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: "27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - uses: christian-draeger/write-properties@1.1.0
        with:
          path: app/version.properties
          property: VERSION_NUM
          value: ${{ github.run_number }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build_release:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: 21
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          ndk-version: "27.2.12479018"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android
          rustup target add i686-linux-android
          rustup target add x86_64-linux-android

      - uses: christian-draeger/write-properties@1.1.0
        with:
          path: app/version.properties
          property: VERSION_NUM
          value: ${{ github.run_number }}

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          echo "$RELEASE_KEYSTORE" | base64 --decode > app/keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  draft_release:
    name: Create draft GitHub release
    needs: [build_debug, build_release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: debug-apk
          path: apks/debug

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: apks/release

      - name: Create draft release with APK assets
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: Key Mapper build ${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          files: |
            apks/debug/*.apk
            apks/release/*.apk
